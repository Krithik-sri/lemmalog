[package]
name = "lemmalog"
version = "0.2.0"
edition = "2021"
description = "A Datalog engine for LLM context management: bi-temporal, provenance-annotated, incrementally maintained."
license = "MIT"

[dependencies]
serde_json = { version = "1", optional = true }
ureq = { version = "2", optional = true }
# GLiNER inference in Rust (lib name `gliner`); pulls in ONNX Runtime via `ort`,
# so it is optional and off by default.
gline-rs = { git = "https://github.com/dhaneshkk/gline-rs", branch = "main", optional = true }
orp = { version = "1.0.0", optional = true }
composable = { version = "1.0.0", optional = true }
# GLinker entity linking in Rust (lib name `glinker_rs`), in-process; same orp/ort pins as gline-rs.
glinker-rs = { git = "https://github.com/dhaneshkk/glinker-rs", branch = "main", optional = true }

[[bin]]
name = "lemmalog-mcp"
required-features = ["mcp"]

[[bin]]
name = "lemmalog-bench"
required-features = ["llm"]

[[bin]]
name = "lemmalog-cli"
required-features = ["mcp"]

[[example]]
name = "gliner_memory"
required-features = ["gliner", "glinker"]

[[example]]
name = "extraction_eval"
required-features = ["gliner", "glinker"]

[[example]]
name = "lmstudio"
required-features = ["llm"]

[[example]]
name = "llm_rules"
required-features = ["llm"]

[[example]]
name = "longmemeval"
required-features = ["llm"]

[features]
# Real-model integration: OpenAI-compatible chat + embeddings (LM Studio,
# llama.cpp server, OpenAI, etc.). Enable with --features llm.
llm = ["dep:ureq", "dep:serde_json"]
# MCP server binary (Model Context Protocol over stdio) for agent CLIs
# (Claude Code, Kimi CLI, ...). Needs only serde_json.
mcp = ["dep:serde_json"]
# Model-based extraction without an LLM: gline-rs NER + relation extraction.
gliner = ["dep:gline-rs", "dep:orp", "dep:composable"]
# Load the ONNX Runtime shared library at run time instead of downloading it at build time.
gliner-load-dynamic = ["gliner", "gline-rs/load-dynamic"]
# Entity linking with glinker-rs (in-process, no sidecar).
glinker = ["dep:glinker-rs", "dep:serde_json"]
